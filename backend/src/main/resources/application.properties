spring.application.name=bodywise
server.port=${PORT:8080}

# --- Database: H2 file database in ./data (zero setup). Swap the URL for Postgres/MySQL later if you like.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bodywise;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- App
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Dev-only default. Set JWT_SECRET (32+ chars) for anything real.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.ttl-days=30

# --- 7 pm grocery reminder (cron: sec min hour day month weekday, in app.timezone)
app.reminder.cron=${REMINDER_CRON:0 0 19 * * *}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}

# --- SMTP. Leave MAIL_HOST empty to disable sending (reminders are then only logged).
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<16-char app password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.error.include-message=always
